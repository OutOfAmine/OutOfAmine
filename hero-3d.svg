<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1b1a3d"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EEFF00"/>
      <stop offset="0.5" stop-color="#6B5FF7"/>
      <stop offset="1" stop-color="#a82da8"/>
      <animate attributeName="x1" values="0;1;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B5FF7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6B5FF7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="floorGlow">
      <stop offset="0" stop-color="#6B5FF7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6B5FF7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34.64" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 0 L34.64 20 M34.64 0 L0 20" stroke="#6B5FF7" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" rx="22" fill="url(#bg)"/>
  <rect width="900" height="300" rx="22" fill="url(#grid)"/>

  <!-- ============ TEXT ============ -->
  <text x="50" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e" letter-spacing="4">HI, I'M MOHAMED AMINE</text>
  <text x="47" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="50" font-weight="800" fill="url(#title)" textLength="440" lengthAdjust="spacingAndGlyphs">WEB DEVELOPER</text>
  <text x="50" y="197" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#c9d1d9">Full Stack · Angular · React · Laravel</text>
  <rect x="48" y="220" width="400" height="34" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="62" y="242" font-family="Consolas, Menlo, monospace" font-size="14" fill="#7ee787">$<tspan fill="#c9d1d9"> npm run build-the-web</tspan></text>
  <rect x="274" y="229" width="8" height="16" fill="#6B5FF7">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- ============ 3D ISOMETRIC LAPTOP ============ -->
  <ellipse cx="690" cy="235" rx="170" ry="55" fill="url(#floorGlow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Base thickness (visible side faces) -->
  <polygon points="573.4,195 712,275 712,283 573.4,203" fill="#2a2f3a"/>
  <polygon points="712,275 798.6,225 798.6,233 712,283" fill="#1c2029"/>

  <!-- Base / keyboard (floor plane) -->
  <g transform="matrix(0.866,0.5,-0.866,0.5,660,145)">
    <rect x="0" y="0" width="160" height="100" rx="6" fill="#3a4050" stroke="#555d70" stroke-width="1"/>
    <g fill="#23272f">
      <rect x="14" y="14" width="132" height="10" rx="2"/>
      <rect x="14" y="28" width="132" height="10" rx="2"/>
      <rect x="14" y="42" width="132" height="10" rx="2"/>
      <rect x="34" y="56" width="92" height="10" rx="2"/>
    </g>
    <g stroke="#3a4050" stroke-width="2">
      <path d="M30 14v38 M46 14v38 M62 14v38 M78 14v38 M94 14v38 M110 14v38 M126 14v38"/>
    </g>
    <rect x="58" y="72" width="44" height="20" rx="3" fill="#2d323d" stroke="#555d70" stroke-width="0.8"/>
  </g>

  <!-- Screen (vertical plane on the back edge) -->
  <g transform="matrix(0.866,0.5,0,1,660,35)">
    <rect x="0" y="0" width="160" height="110" rx="6" fill="#20242d" stroke="#555d70" stroke-width="1.2"/>
    <rect x="6" y="6" width="148" height="98" rx="3" fill="#0d1117"/>
    <!-- browser bar -->
    <rect x="6" y="6" width="148" height="12" rx="3" fill="#161b22"/>
    <circle cx="13" cy="12" r="2" fill="#ff5f56"/>
    <circle cx="20" cy="12" r="2" fill="#ffbd2e"/>
    <circle cx="27" cy="12" r="2" fill="#27c93f"/>
    <rect x="36" y="9" width="70" height="6" rx="3" fill="#30363d"/>
    <!-- code -->
    <g font-family="Consolas, Menlo, monospace" font-size="8">
      <text x="12" y="32" fill="#ff7b72">&lt;<tspan fill="#7ee787">html</tspan>&gt;</text>
      <text x="20" y="44" fill="#ff7b72">&lt;<tspan fill="#7ee787">app-root</tspan>&gt;</text>
      <text x="28" y="56" fill="#d2a8ff">const <tspan fill="#79c0ff">dev</tspan><tspan fill="#c9d1d9"> = </tspan><tspan fill="#a5d6ff">'Amine'</tspan></text>
      <text x="28" y="68" fill="#d2a8ff">Route<tspan fill="#c9d1d9">::</tspan><tspan fill="#79c0ff">get</tspan><tspan fill="#c9d1d9">('/api')</tspan></text>
      <text x="20" y="80" fill="#ff7b72">&lt;/<tspan fill="#7ee787">app-root</tspan>&gt;</text>
      <text x="12" y="92" fill="#ff7b72">&lt;/<tspan fill="#7ee787">html</tspan>&gt;</text>
    </g>
    <!-- typing bar -->
    <rect x="62" y="86" width="0" height="7" fill="#6B5FF7" opacity="0.8">
      <animate attributeName="width" values="0;70;70;0" keyTimes="0;0.5;0.85;1" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- screen top edge -->
  <polygon points="660,35 798.6,115 802,113 663.4,33" fill="#3a4050"/>

  <!-- ============ FLOATING WEB BADGES ============ -->
  <g font-family="Consolas, Menlo, monospace" font-weight="700" text-anchor="middle">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="3s" repeatCount="indefinite"/>
      <rect x="540" y="60" width="56" height="30" rx="8" fill="#DD0031"/>
      <text x="568" y="80" font-size="14" fill="#fff">&lt;/&gt;</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="3.6s" repeatCount="indefinite"/>
      <rect x="818" y="40" width="54" height="30" rx="8" fill="#6B5FF7"/>
      <text x="845" y="60" font-size="14" fill="#fff">{ }</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="2.8s" repeatCount="indefinite"/>
      <rect x="826" y="150" width="50" height="28" rx="8" fill="#FF2D20"/>
      <text x="851" y="169" font-size="12" fill="#fff">API</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="3.3s" repeatCount="indefinite"/>
      <rect x="560" y="215" width="46" height="26" rx="8" fill="#38B2AC"/>
      <text x="583" y="233" font-size="12" fill="#fff">CSS</text>
    </g>
  </g>

  <!-- Sparkles -->
  <g fill="#fff">
    <circle cx="620" cy="30" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="110" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="255" r="1.6"><animate attributeName="opacity" values="0;1;0" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="20" r="1.4"><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="0.4s" repeatCount="indefinite"/></circle>
  </g>
</svg>
